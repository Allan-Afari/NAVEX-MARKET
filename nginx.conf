server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Proper MIME types for assets
  types {
    text/html html;
    text/css css;
    text/javascript js;
    application/javascript js;
    application/json json;
    image/svg+xml svg;
    image/png png;
    image/jpg jpg;
    image/jpeg jpeg;
    image/gif gif;
    image/webp webp;
    application/font-woff2 woff2;
    application/font-woff woff;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(css|js|json|txt|xml|svg|ico|png|jpg|jpeg|gif|webp|avif|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
